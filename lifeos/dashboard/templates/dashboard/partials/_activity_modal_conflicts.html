{% if schedule_conflicts %}
<div class="modal-schedule-warning mb-3" role="status">
  <div class="d-flex align-items-start gap-2">
    <i class="fa-solid fa-triangle-exclamation mt-1" style="color:var(--yellow)"></i>
    <div>
      <strong class="text-warning">Schedule overlap</strong>
      <p class="small text-muted mb-1">This time window may conflict with:</p>
      <ul class="small mb-0 ps-3">
        {% for c in schedule_conflicts %}
        <li>
          <span class="font-mono">{{ c.start_time|time:'H:i' }}{% if c.end_time %}–{{ c.end_time|time:'H:i' }}{% endif %}</span>
          — {{ c.name }} <span class="text-muted">({{ c.get_status_display }})</span>
        </li>
        {% endfor %}
      </ul>
    </div>
  </div>
</div>
{% endif %}
