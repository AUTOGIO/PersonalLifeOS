{% load static %}
<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="LIFE OS — Personal Life Management Dashboard. Schedule, AI Dev tracking, habits, and more." />
  <meta name="csrf-token" content="{{ csrf_token }}" />
  <title>{% block title %}LIFE OS{% endblock %}</title>

  <!-- HTMX CSRF configuration -->
  <script>
    document.addEventListener('DOMContentLoaded', function() {
      document.body.setAttribute('hx-headers', JSON.stringify({'X-CSRFToken': '{{ csrf_token }}'}));
    });
  </script>

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@300;400;500;600;700&family=Rajdhani:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet" />

  <!-- Font Awesome 6 -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />

  <!-- Bootstrap 5 -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />

  <!-- Custom CSS -->
  <link rel="stylesheet" href="{% static 'css/custom.css' %}" />

  {% block extra_css %}{% endblock %}
</head>
<body>

  <!-- ── Particles background ─────────────────────────────────────────── -->
  <div id="particles-js"></div>

  <!-- ── Sidebar ──────────────────────────────────────────────────────── -->
  <nav class="sidebar" id="sidebar">
    <div class="sidebar-brand">
      <span class="brand-icon">⚡</span>
      <span class="brand-text">LIFE<span class="brand-accent">OS</span></span>
    </div>

    <ul class="sidebar-nav">
      <li class="nav-item {% if request.resolver_match.url_name == 'dashboard' or request.resolver_match.url_name == 'home' %}active{% endif %}">
        <a href="{% url 'dashboard' %}" class="nav-link">
          <i class="fa-solid fa-gauge-high nav-icon"></i>
          <span class="nav-label">Dashboard</span>
        </a>
      </li>
      <li class="nav-item {% if request.resolver_match.url_name == 'planner' %}active{% endif %}">
        <a href="{% url 'planner' %}" class="nav-link">
          <i class="fa-solid fa-calendar-days nav-icon"></i>
          <span class="nav-label">Planner</span>
        </a>
      </li>
      <li class="nav-item {% if request.resolver_match.url_name == 'analytics' %}active{% endif %}">
        <a href="{% url 'analytics' %}" class="nav-link">
          <i class="fa-solid fa-chart-line nav-icon"></i>
          <span class="nav-label">Analytics</span>
        </a>
      </li>
      <li class="nav-item {% if request.resolver_match.url_name == 'activities_list' %}active{% endif %}">
        <a href="{% url 'activities_list' %}" class="nav-link">
          <i class="fa-solid fa-list-check nav-icon"></i>
          <span class="nav-label">Activities</span>
        </a>
      </li>
    </ul>

    <div class="sidebar-footer">
      <a href="/admin/" class="nav-link">
        <i class="fa-solid fa-screwdriver-wrench nav-icon"></i>
        <span class="nav-label">Admin</span>
      </a>
      <button class="sidebar-toggle-btn" id="sidebarToggle" title="Toggle sidebar">
        <i class="fa-solid fa-angles-left" id="toggleIcon"></i>
      </button>
    </div>
  </nav>

  <!-- ── Main Content ──────────────────────────────────────────────────── -->
  <main class="main-content" id="mainContent">

    <!-- Top Bar -->
    <div class="topbar">
      <div class="topbar-left">
        <button class="mobile-menu-btn" id="mobileMenuBtn">
          <i class="fa-solid fa-bars"></i>
        </button>
        <h1 class="page-title">{% block page_title %}LIFE OS{% endblock %}</h1>
      </div>
      <div class="topbar-right">
        <div class="clock-display" id="liveClock">--:--:--</div>
        <div class="date-display" id="liveDate">-- --- ----</div>
      </div>
    </div>

    <!-- Page Content -->
    <div class="content-area">
      {% block content %}{% endblock %}
    </div>
  </main>

  <!-- ── Toast Container ────────────────────────────────────────────────── -->
  <div id="toast-container" aria-live="polite"></div>

  <!-- ── HTMX Loading Bar ───────────────────────────────────────────────── -->
  <div id="htmx-loading-bar"></div>

  <!-- ── Global Modals ─────────────────────────────────────────────────── -->
  <div class="modal fade" id="activityModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered modal-lg">
      <div class="modal-content lifeos-modal" id="activityModalContent">
        <!-- HTMX fills this -->
        <div class="modal-body text-center py-5">
          <div class="spinner-border text-accent" role="status"></div>
        </div>
      </div>
    </div>
  </div>

  <!-- ── Scripts ───────────────────────────────────────────────────────── -->
  <!-- Bootstrap JS -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <!-- HTMX -->
  <script src="https://unpkg.com/htmx.org@1.9.12"></script>
  <!-- Chart.js -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.2/dist/chart.umd.min.js"></script>
  <!-- Alpine.js (tide card + small interactions) -->
  <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.13.5/dist/cdn.min.js"></script>
  <!-- FullCalendar -->
  <script src="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.11/index.global.min.js"></script>
  <!-- particles.js -->
  <script src="https://cdn.jsdelivr.net/npm/particles.js@2.0.0/particles.min.js"></script>

  <script>
    // ── Live Clock (BRT = UTC-3) ─────────────────────────────────────────
    function updateClock() {
      const now = new Date();
      const brt = new Date(now.toLocaleString('en-US', {timeZone: 'America/Fortaleza'}));
      const h = String(brt.getHours()).padStart(2,'0');
      const m = String(brt.getMinutes()).padStart(2,'0');
      const s = String(brt.getSeconds()).padStart(2,'0');
      document.getElementById('liveClock').textContent = `${h}:${m}:${s}`;
      const days = ['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];
      const months = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
      document.getElementById('liveDate').textContent =
        `${days[brt.getDay()]}, ${brt.getDate()} ${months[brt.getMonth()]} ${brt.getFullYear()}`;
    }
    setInterval(updateClock, 1000);
    updateClock();

    // ── Sidebar toggle ───────────────────────────────────────────────────
    const sidebar = document.getElementById('sidebar');
    const mainContent = document.getElementById('mainContent');
    const toggleIcon = document.getElementById('toggleIcon');
    document.getElementById('sidebarToggle').addEventListener('click', () => {
      sidebar.classList.toggle('collapsed');
      mainContent.classList.toggle('sidebar-collapsed');
      toggleIcon.classList.toggle('fa-angles-left');
      toggleIcon.classList.toggle('fa-angles-right');
    });
    document.getElementById('mobileMenuBtn').addEventListener('click', () => {
      sidebar.classList.toggle('mobile-open');
    });

    // ── particles.js init ────────────────────────────────────────────────
    particlesJS('particles-js', {
      particles: {
        number: { value: 40, density: { enable: true, value_area: 900 } },
        color: { value: ['#000000','#ffffff','#22c55e','#2563eb','#eab308','#ef4444','#f97316'] },
        shape: { type: 'circle' },
        opacity: { value: 0.15, random: true },
        size: { value: 2, random: true },
        line_linked: { enable: true, distance: 160, color: '#f97316', opacity: 0.06, width: 1 },
        move: { enable: true, speed: 0.6, direction: 'none', random: true, out_mode: 'out' }
      },
      interactivity: {
        detect_on: 'canvas',
        events: { onhover: { enable: true, mode: 'grab' }, onclick: { enable: false } },
        modes: { grab: { distance: 140, line_linked: { opacity: 0.3 } } }
      },
      retina_detect: true
    });

    // ── TOAST SYSTEM ────────────────────────────────────────────────────
    window.showToast = function(message, type = 'success', duration = 3000) {
      const icons = { success: '✅', error: '❌', info: 'ℹ️', warning: '⚠️', kite: '🪁', fire: '🔥' };
      const colors = { success: '#22c55e', error: '#ef4444', info: '#2563eb', warning: '#eab308', kite: '#22c55e', fire: '#f97316' };
      const toast = document.createElement('div');
      toast.className = 'lifeos-toast';
      toast.style.setProperty('--tc', colors[type] || colors.success);
      toast.innerHTML = `<span class="toast-icon">${icons[type] || icons.success}</span><span class="toast-msg">${message}</span><button class="toast-close" onclick="this.parentElement.remove()">×</button>`;
      document.getElementById('toast-container').appendChild(toast);
      requestAnimationFrame(() => toast.classList.add('toast-show'));
      setTimeout(() => { toast.classList.remove('toast-show'); setTimeout(() => toast.remove(), 400); }, duration);
    };

    // ── HTMX Loading Bar ─────────────────────────────────────────────────
    const loadingBar = document.getElementById('htmx-loading-bar');
    document.body.addEventListener('htmx:beforeRequest', () => loadingBar.classList.add('loading'));
    document.body.addEventListener('htmx:afterRequest', () => loadingBar.classList.remove('loading'));

    // ── HTMX → Toast feedback ────────────────────────────────────────────
    document.body.addEventListener('htmx:afterSwap', (e) => {
      if (e.detail.target.id === 'activityModalContent') {
        const modal = new bootstrap.Modal(document.getElementById('activityModal'));
        modal.show();
        return;
      }
      // Toast on status toggle
      const target = e.detail.target;
      if (target && target.id && target.id.startsWith('activity-row-')) {
        const badge = target.querySelector('.status-badge');
        if (badge) {
          const status = badge.textContent.trim();
          const msgs = { Done: ['fire','Crushed it! 🤘'], Skipped: ['warning','Skipped — move on!'], Planned: ['info','Reset to Planned'] };
          const [type, msg] = msgs[status] || ['info', `Status: ${status}`];
          showToast(msg, type);
          if (status === 'Done') spawnConfetti(target);
        }
      }
      // Toast after daily plan save
      if (target && target.id === 'plan-panel-content') {
        showToast('Daily plan saved! 📝', 'success');
      }
      // Toast after session start/stop
      if (target && target.id === 'session-panel-wrapper') {
        const isActive = target.querySelector('.session-active');
        showToast(isActive ? '⏱️ Session started! Rock on!' : '⏹️ Session stopped & logged.', isActive ? 'fire' : 'info');
        if (isActive) reinitSessionTimer();
      }
    });

    // ── CONFETTI on DONE ────────────────────────────────────────────────
    function spawnConfetti(anchor) {
      const colors = ['#000000','#ffffff','#22c55e','#2563eb','#eab308','#ef4444','#f97316'];
      const rect = anchor.getBoundingClientRect();
      for (let i = 0; i < 28; i++) {
        const p = document.createElement('div');
        p.className = 'confetti-particle';
        p.style.cssText = `
          left:${rect.left + rect.width/2 + (Math.random()-0.5)*80}px;
          top:${rect.top + rect.height/2}px;
          background:${colors[Math.floor(Math.random()*colors.length)]};
          --dx:${(Math.random()-0.5)*200}px;
          --dy:${-(Math.random()*160+60)}px;
          animation-delay:${Math.random()*0.2}s;
        `;
        document.body.appendChild(p);
        setTimeout(() => p.remove(), 1200);
      }
    }

    // ── KEYBOARD SHORTCUTS ───────────────────────────────────────────────
    document.addEventListener('keydown', (e) => {
      if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA' || e.target.isContentEditable) return;
      const shortcuts = { 'd': '/', 'p': '/planner/', 'a': '/analytics/', 'l': '/activities/' };
      if (!e.ctrlKey && !e.metaKey && !e.altKey && shortcuts[e.key.toLowerCase()]) {
        e.preventDefault();
        window.location.href = shortcuts[e.key.toLowerCase()];
      }
      // ? for keyboard help
      if (e.key === '?') showToast('Shortcuts: D=Dashboard  P=Planner  A=Analytics  L=Activities', 'info', 5000);
    });

    // ── Re-init session timer after HTMX swap ───────────────────────────
    function reinitSessionTimer() {
      setTimeout(() => {
        const startEl = document.getElementById('session-start-time');
        if (!startEl) return;
        const startISO = startEl.dataset.start;
        if (!startISO) return;
        const startDate = new Date(startISO);
        const timerEl = document.getElementById('session-elapsed');
        function tick() {
          const diff = Math.floor((Date.now() - startDate) / 1000);
          const hh = String(Math.floor(diff / 3600)).padStart(2,'0');
          const mm = String(Math.floor((diff % 3600) / 60)).padStart(2,'0');
          const ss = String(diff % 60).padStart(2,'0');
          if (timerEl) timerEl.textContent = `${hh}:${mm}:${ss}`;
        }
        if (window._sessionTimerInterval) clearInterval(window._sessionTimerInterval);
        window._sessionTimerInterval = setInterval(tick, 1000);
        tick();
      }, 100);
    }

    // ── Ripple effect on buttons ─────────────────────────────────────────
    document.body.addEventListener('click', (e) => {
      const btn = e.target.closest('.btn-gradient, .btn-stop, .btn-outline-accent, .timeline-quick-btn');
      if (!btn) return;
      const ripple = document.createElement('span');
      ripple.className = 'btn-ripple';
      const rect = btn.getBoundingClientRect();
      ripple.style.left = `${e.clientX - rect.left}px`;
      ripple.style.top = `${e.clientY - rect.top}px`;
      btn.style.position = 'relative';
      btn.style.overflow = 'hidden';
      btn.appendChild(ripple);
      setTimeout(() => ripple.remove(), 600);
    });

    // Hint toast on first load
    setTimeout(() => showToast('Press <strong>?</strong> for keyboard shortcuts', 'info', 4000), 1500);
  </script>

  {% block extra_js %}{% endblock %}
</body>
</html>
